<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kedai Online</title>
  <style>
    body { font-family: Arial; background:#f9f9f9; }
    h1 { text-align:center; }
    .product {
      border:1px solid #ccc; 
      padding:10px; 
      margin:10px; 
      display:inline-block; 
      width:200px; 
      vertical-align:top; 
      background:white;
      border-radius:8px;
    }
    .btn {
      display:inline-block; 
      margin-top:5px; 
      padding:8px; 
      text-decoration:none; 
      border-radius:5px;
    }
    .whatsapp { background:#25D366; color:white; }
    #filter { margin:20px; padding:8px; }
  </style>
</head>
<body>
  <h1>Kedai Online</h1>

  <!-- Dropdown filter -->
  <div style="text-align:center;">
    <label for="filter">Pilih kategori: </label>
    <select id="filter">
      <option value="all">Semua</option>
      <option value="iPhone">iPhone</option>
      <option value="Huawei">Huawei</option>
      <option value="Samsung">Samsung</option>
      <option value="iPad">iPad</option>
    </select>
  </div>

  <div id="product-list"></div>

  <script>
    let allProducts = [];

    // Guna link CSV dari Google Sheet
    fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQnnHl1vkLVbCgzH-pQrG9dRLJ6V8-eyrlhrYDRXYEHoHciN4qIFGr0ipO7xxIS5OFHGRgZJJYX2bMX/pub?output=csv")
      .then(res => res.text())
      .then(text => {
        let rows = text.split("\n");
        rows.slice(1).forEach(row => {
          let cols = row.split(",");
          allProducts.push({
            nama: cols[0],
            kategori: cols[1],
            harga: cols[2],
            status: cols[3],
            gambar: cols[4]
          });
        });
        renderProducts("all");
      });

    // Function untuk render ikut kategori
    function renderProducts(filter) {
      let html = "";
      allProducts.forEach(p => {
        if (filter === "all" || p.kategori === filter) {
          html += `<div class="product">
                    <img src="${p.gambar}" style="width:150px;height:auto;"><br>
                    <b>${p.nama}</b><br>
                    Kategori: ${p.kategori}<br>
                    Harga: RM${p.harga}<br>
                    Status: ${p.status}<br>
                    <a href="https://wa.me/60134114597?text=Hi, saya nak tanya pasal ${p.nama}" target="_blank" class="btn whatsapp">WhatsApp</a>
                   </div>`;
        }
      });
      document.getElementById("product-list").innerHTML = html;
    }

    // Event bila dropdown berubah
    document.getElementById("filter").addEventListener("change", function() {
      renderProducts(this.value);
    });
  </script>
</body>
</html>
