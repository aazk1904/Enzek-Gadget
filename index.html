<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kedai Online</title>
  <style>
    body { font-family: Arial; background:#f9f9f9; }
    h1 { text-align:center; }
    .product {
      border:1px solid #ccc; 
      padding:10px; 
      margin:10px; 
      display:inline-block; 
      width:200px; 
      vertical-align:top; 
      background:white;
      border-radius:8px;
      cursor:pointer;
    }
    .detail {
      display:none; 
      position:fixed; 
      top:10%; left:50%; 
      transform:translateX(-50%); 
      background:white; 
      padding:20px; 
      border:1px solid #ccc; 
      border-radius:8px;
      max-width:500px;
      max-height:80%;
      overflow:auto;
    }
    .close { float:right; cursor:pointer; color:red; font-weight:bold; }
    .detail img { width:150px; height:auto; margin:5px; }
  </style>
</head>
<body>
  <h1>Kedai Online</h1>
  <div id="product-list"></div>

  <!-- Popup detail -->
  <div id="detailBox" class="detail">
    <span class="close" onclick="document.getElementById('detailBox').style.display='none'">X</span>
    <div id="detailContent"></div>
  </div>

  <script>
    let allProducts = [];

    fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQnnHl1vkLVbCgzH-pQrG9dRLJ6V8-eyrlhrYDRXYEHoHciN4qIFGr0ipO7xxIS5OFHGRgZJJYX2bMX/pub?output=csv") // link CSV Google Sheet
      .then(res => res.text())
      .then(text => {
        let rows = text.split("\n");
        rows.slice(1).forEach(row => {
          let cols = row.split(",");
          allProducts.push({
            nama: cols[0],
            kategori: cols[1],
            harga: cols[2],
            status: cols[3],
            detail: cols[4],
            gambar: cols[5] // semua link gambar dipisahkan dengan ;
          });
        });
        renderProducts();
      });

    function renderProducts() {
      let html = "";
      allProducts.forEach((p, i) => {
        let gambarPertama = p.gambar.split(";")[0];
        html += `<div class="product" onclick="showDetail(${i})">
                   <img src="${gambarPertama}" style="width:150px;height:auto;"><br>
                   <b>${p.nama}</b><br>
                   Harga: ${p.harga}
                 </div>`;
      });
      document.getElementById("product-list").innerHTML = html;
    }

    function showDetail(index) {
      let p = allProducts[index];
      let gambarLinks = p.gambar.split(";");
      let gambarHTML = "";
      gambarLinks.forEach(g => {
        gambarHTML += `<img src="${g}">`;
      });

      let detailHTML = `
        <h3>${p.nama}</h3>
        ${gambarHTML}<br>
        Kategori: ${p.kategori}<br>
        Harga: ${p.harga}<br>
        Status: ${p.status}<br>
        Detail: ${p.detail}<br>
        <a href="https://wa.me/60134114597?text=Hi, saya nak tanya pasal ${p.nama}" target="_blank">WhatsApp</a>
      `;
      document.getElementById("detailContent").innerHTML = detailHTML;
      document.getElementById("detailBox").style.display = "block";
    }
  </script>
</body>
</html>
